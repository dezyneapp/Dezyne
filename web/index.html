<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1e293b" />
    
    <!-- App Info -->
    <title>Dezyne - Upcycled Fashion Marketplace</title>
    <meta name="description" content="Buy and sell unique upcycled clothing on Dezyne. Discover one-of-a-kind fashion pieces transformed through painting, embroidery, and creative upcycling." />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dezyne" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    
    <!-- Prevent text size adjustment on orientation change -->
    <style>
      * {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading screen */
      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        background-color: #1e293b;
        color: #f3f4f6;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="loading">Loading Dezyne...</div>
    </div>
  </body>
</html>
